name: Codex Canary — weekly latest drift

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-canary
  cancel-in-progress: false
jobs:
  canary:
    name: Canary — latest drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm install -g @openai/codex@latest
      - run: npm run report:tool-versions
      - run: npm run validate
      - name: Latest host installation/discovery drift (informational, non-required)
        run: node scripts/smoke-codex-plugin.mjs --allow-version-drift
      - name: Real Python validator contract
        env:
          REQUIRE_PYTHON: '1'
        run: node --test tests/diagram-validator-contract.test.mjs
